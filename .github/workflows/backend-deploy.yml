name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read

jobs:
  deploy-backend:
    if: github.repository == 'zlg233/pinf'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          BACKEND_PATH: ${{ vars.BACKEND_PATH }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_HOST_FINGERPRINT BACKEND_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -eu
            test "$(id -u)" -eq 0
            cd "${{ vars.BACKEND_PATH }}"
            test "$(git branch --show-current)" = main
            git remote set-url origin https://github.com/zlg233/pinf.git
            git fetch origin main
            git merge --ff-only "${{ github.sha }}"
            docker compose up -d --build --no-deps backend
